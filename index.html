<body>
  <div class="gate-wrap">
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-header-avatar">
          <img src="/assets/65e88c6319801815fa38ea12_lw_logo.png" alt="LW"/>
        </div>
        <div class="chat-header-info">
          <span class="chat-header-name">Portfolio Agent</span>
          <span class="chat-header-status">laurenwynne.com</span>
        </div>
      </div>
      <div class="chat-messages" id="messages">
        <div class="msg agent">
          <div class="agent-avatar">
            <img src="/assets/65e88c6319801815fa38ea12_lw_logo.png" alt="LW" width="28"/>
          </div>
          <div class="bubble">Hi, I'm Lauren's portfolio agent. Enter the password to enter :)</div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <div class="chat-input-row">
          <input type="text" id="gate-input" placeholder="Message..." autocomplete="off" autocorrect="off" spellcheck="false"/>
          <button id="gate-send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 13V3M8 3L4 7M8 3L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
